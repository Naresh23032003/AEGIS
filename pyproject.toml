[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
  "**/generated",
  ".venv",
  "node_modules",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["apps/core/aegis"]

# Generated code (make contracts) is not held to strict: constrained-type
# factories like conint()/confloat() as annotations are valid pydantic v2 at
# runtime but not statically typeable by mypy.
[[tool.mypy.overrides]]
module = "aegis.contracts.generated.*"
ignore_errors = true

# reportlab ships no type stubs (phase 6, evidence pack PDF generation).
[[tool.mypy.overrides]]
module = "reportlab.*"
ignore_missing_imports = true
