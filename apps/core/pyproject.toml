[project]
name = "aegis-core"
version = "0.1.0"
description = "AEGIS core: REST/WS API, agent worker, and executor entrypoints."
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.1",
  "pydantic==2.13.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aegis"]
