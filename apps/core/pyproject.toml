[project]
name = "aegis-core"
version = "0.1.0"
description = "AEGIS core: REST/WS API, agent worker, and executor entrypoints."
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.1",
  "pydantic==2.13.4",
  "asyncpg==0.31.0",
  "redis==8.1.0",
  "python-ulid==4.0.1",
  "PyYAML==6.0.3",
  "httpx==0.28.1",
  "docker==7.2.0",
  "slowapi==0.1.10",
  "langgraph==0.6.11",
  "langgraph-checkpoint-postgres==2.0.25",
  "psycopg[binary,pool]==3.2.13",
  "openai==1.109.1",
  "PyNaCl==1.6.1",
  "reportlab==4.4.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aegis"]
