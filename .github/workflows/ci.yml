name: ci

on:
  push:
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dev tooling
        run: |
          make venv
          .venv/bin/pip install -e apps/core

      - name: Install Node dependencies
        run: npm ci

      - name: Regenerate contracts
        run: make contracts

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: e2e (fixtures only, no scenarios before phase 1)
        run: make e2e
