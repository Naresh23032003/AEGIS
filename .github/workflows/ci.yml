name: ci

on:
  push:
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dev tooling
        run: |
          make venv
          .venv/bin/pip install -e apps/core

      - name: Install Node dependencies
        run: npm ci

      - name: Regenerate contracts
        run: make contracts

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Bring up the stack (MOCK_LLM=1, no API key needed)
        run: make up

      - name: e2e (fixtures only)
        run: MOCK_LLM=1 make e2e

      - name: Worker logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs core-worker core-executor core-api

      - name: Tear down the stack
        if: always()
        run: make down
