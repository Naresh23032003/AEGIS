name: aegis

networks:
  default:
    name: aegis-net

volumes:
  shop-db-data:
  aegis-db-data:

services:
  # --- infra: real images, healthchecked ---

  shop-db:
    image: postgres:16.14
    # aegis.actions.execute's restart_database maps to this literal
    # container name (found live in phase 3: without it, compose names the
    # container aegis-shop-db-1 and every restart_database action 404s).
    container_name: shop-db
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis
      POSTGRES_DB: shop
    volumes:
      - shop-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d shop"]
      interval: 5s
      timeout: 3s
      retries: 10

  aegis-db:
    image: postgres:16.14
    command: ["postgres", "-p", "5433"]
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis
      POSTGRES_DB: aegis
    volumes:
      - aegis-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis -p 5433"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Two Redis instances, not one (plan/01-architecture.md, Runtime topology).
  # shop-redis is the demo shop's cache and the only Redis any catalog
  # action may name; aegis-redis carries the aegis:events stream and is in
  # no catalog, so no agent can reach it. A single instance let
  # restart_dependency restart AEGIS's own event bus mid-incident, which is
  # where the "failed to publish event" lines in the phase 8 live run came
  # from (docs/reports/FINAL_VERIFICATION.md, Live verification).
  shop-redis:
    image: redis:7.4.10
    container_name: shop-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  aegis-redis:
    image: redis:7.4.10
    container_name: aegis-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  opa:
    image: openpolicyagent/opa:1.19.0-debug
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policies"]
    volumes:
      - ../packages/policies:/policies:ro
    healthcheck:
      # the opa image has no curl/wget; netstat (busybox) confirms the server is listening
      test: ["CMD-SHELL", "netstat -tln | grep -q :8181"]
      interval: 5s
      timeout: 3s
      retries: 10

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.10.0
    healthcheck:
      test: ["CMD", "/toxiproxy-cli", "list"]
      interval: 5s
      timeout: 3s
      retries: 10

  lgtm:
    image: grafana/otel-lgtm:0.28.0
    ports:
      - "3001:3000" # Grafana on host 3001
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # --- target system: gateway/orders/payments, loadgen, phase 1 ---

  target-gateway:
    build:
      context: ../apps/target/gateway
    container_name: target-gateway
    ports:
      - "9000:9000"
    env_file:
      - ../.env
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request as u; u.urlopen('http://localhost:9000/healthz', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      target-orders:
        condition: service_healthy
      target-payments:
        condition: service_healthy

  target-orders:
    build:
      context: ../apps/target/orders
    container_name: target-orders
    env_file:
      - ../.env
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request as u; u.urlopen('http://localhost:9001/healthz', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      shop-db:
        condition: service_healthy
      shop-redis:
        condition: service_healthy
      toxiproxy:
        condition: service_healthy

  target-payments:
    build:
      context: ../apps/target/payments
    container_name: target-payments
    mem_limit: 200m
    # No restart policy: an OOM kill (memory_leak) must stay down long
    # enough for service_down to fire, same as a manual `docker stop`
    # (crash). Auto-restarting here would race Docker's own recovery
    # against detection and, worse, silently do the remediation agent's
    # restart_service job before the agent ever runs (phase 2). Clearing
    # the scenario (aegis/chaos.py, _clear_memory_leak) restarts it instead.
    env_file:
      - ../.env
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request as u; u.urlopen('http://localhost:9002/healthz', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  loadgen:
    build:
      context: ../apps/loadgen
    depends_on:
      target-gateway:
        condition: service_healthy

  # --- core: api / worker / executor share one image ---
  # core-executor is the only service with the Docker socket mounted,
  # per plan/04-security.md, Executor sandbox (phase 2).

  core-api:
    build:
      context: ..
      dockerfile: apps/core/Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - ../.env
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request as u; u.urlopen('http://localhost:8080/healthz', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      aegis-db:
        condition: service_healthy
      aegis-redis:
        condition: service_healthy
      opa:
        condition: service_healthy
      toxiproxy:
        condition: service_healthy
      target-payments:
        condition: service_healthy

  core-worker:
    build:
      context: ..
      dockerfile: apps/core/Dockerfile
    command: ["python", "-m", "aegis.worker"]
    env_file:
      - ../.env
    # Read-only repo checkout for the diagnose node's list_recent_changes
    # tool (git log against a target service's directory). core-worker
    # never gets the Docker socket; that stays on core-executor alone.
    # fixtures is read-write so `make record-fixtures` (RECORD_FIXTURES=1,
    # a one-off replacement worker) persists what it records back to the
    # host instead of into a container that gets thrown away.
    volumes:
      - ../:/repo:ro
      - ../apps/core/fixtures:/app/fixtures
    depends_on:
      aegis-db:
        condition: service_healthy
      aegis-redis:
        condition: service_healthy
      lgtm:
        condition: service_healthy
      target-gateway:
        condition: service_healthy
      target-orders:
        condition: service_healthy
      target-payments:
        condition: service_healthy
      core-executor:
        condition: service_healthy

  core-executor:
    build:
      context: ..
      dockerfile: apps/core/Dockerfile
    command: ["python", "-m", "aegis.executor"]
    env_file:
      - ../.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request as u; u.urlopen('http://localhost:8090/healthz', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      aegis-db:
        condition: service_healthy
      # clear_cache and flush_queue talk to the shop cache, never to
      # aegis-redis; the executor holds no connection to the event stream.
      shop-redis:
        condition: service_healthy

  # --- console ---

  console:
    build:
      context: ..
      dockerfile: apps/console/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_WS_URL: ws://localhost:8080/ws/events
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      core-api:
        condition: service_healthy
